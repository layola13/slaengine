# Umbrella package — the workspace root crate.
# Role: Bevy's root `bevy` package — one entry point over all member crates.
# Today the entry is the App-layer host skeleton (src/slaengine.sla);
# it thickens as the reserved crates land. See README.md.

[package]
name = "slaengine"
version.workspace = true
kind = "umbrella"
entry = "src/slaengine.sla"
description = "SLA engine umbrella crate: App-layer host (skeleton) and unified workspace entry point."

[dependencies]
slasl = { path = "crates/slasl" }
sax3d = { path = "crates/sax3d" }
