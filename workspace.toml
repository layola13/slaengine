# slaengine workspace — Bevy-form workspace for the SA/SLA engine stack.
#
# This file is the workspace's single source of truth for membership,
# shared package metadata, toolchain pins, and shared external faces.
# Per-crate manifests live in each member's `crate.toml`.
#
# Correspondence with Bevy's root Cargo.toml:
#   [workspace]              <-> Bevy [workspace] (member table)
#   [workspace.package]      <-> Bevy [workspace.package] (shared version/license)
#   [workspace.dependencies] <-> Bevy [workspace.dependencies] (shared faces)
#   [workspace.toolchain]    <-> ecosystem-specific: the pinned rig this
#                                workspace is verified against (Bevy pins via
#                                rust-version; we pin the SA toolchain heads)

[workspace]
members = [
    ".", # umbrella crate `slaengine` — the root package (Bevy root `bevy` crate role)
    "crates/slasl", # active: SLASL shader compiler (SLA tool)
    "crates/sax3d", # active: SAX3D asset format + toolchain (Zig)
    "crates/sla_ecs", # reserved: sla_ecs embed (source enters as a crate, not an external dep)
    "crates/sla_3d", # reserved: sa_plugin_3dengines module port
    "crates/sla_webgl", # reserved: render backend, priority 1 — WebGL surface
    "crates/sla_gpu", # reserved: render backend, priority 2 — Web3D/GPU surface
]
# Members resolve each other by workspace-relative path only; no member may
# reach outside the workspace for another member's code.
resolver = "path"

[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0" # mirrors Bevy's dual-license default; owner to confirm
authors = ["layola13"]

[workspace.toolchain]
# The rig the foundation is verified on (Colab install.sh toolchain).
sci = "83c61d43"
sla = "e3d2023"
zig = "0.17.0"

[workspace.dependencies]
# Shared external faces every member may bind. Engine code lives in the
# members; sa_std is the platform layer below the workspace.
sa_std = { source = "sci/sa_std", note = "bind via @import \"sa_std/...\" (SLA) — no engine logic lives in sa_std" }
