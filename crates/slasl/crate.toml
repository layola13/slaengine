[package]
name = "slasl"
version.workspace = true
kind = "tool"
entry = "src/slasl.sla"
build = "sa build-exe src/slasl.sla -o slasl"
test = "bash run_tests.sh <build-dir>"
description = "SLASL shader compiler: one universal .slasl source set -> per-target shader files (GLSL ES 3.00/1.00, HLSL SM5, WGSL + reflection manifest, MSL, Unity ShaderLab, Blender, Unreal global). SPIR-V is phased P4 in DESIGN.md and not produced yet. Products are shader files + host glue only; no engine/runtime lives in this crate."

# Import provenance: slasl phase-2 delivery, slasl-p2-local @ 125208f.
# Content base aligned 2026-11-01 to the DEF-1 fix commit: src/slasl.sla
# folds scalar @const inside type constructors (subst_expr kind-7 branch),
# 8 formal DEF-1 harness cases added under samples/def1-* (+ goldens),
# REPORT.md wording corrected. Tool body + canonical shaders + goldens +
# per-target samples/goldens + negative corpus imported byte-identical;
# the source tree's work/ probe files were not imported. DESIGN.md is the
# crate's design contract; REPORT.md / VERIFY_REPORT.md /
# FIX_DEF1_REPORT.md are the source delivery and verification records
# (acceptance sign-off for this crate is owned by the independent SLASL
# verification line).
