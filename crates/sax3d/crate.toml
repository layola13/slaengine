[package]
name = "sax3d"
version.workspace = true
kind = "format+lib+tools"
build = "zig build"
lib = "src/lib.zig"
test = ["tests/run_tests.sh", "tests/run_convert.sh"]
description = "SAX3D: SA-native 3D asset format (split + packed forms as equals), toolchain (sax3dc checker/builder/packer, readback), and a bidirectional glTF/GLB converter. Schema single source of truth: sax3d.sai (generates src/schema_gen.zig). Format spec: SPEC.md."

