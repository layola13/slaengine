[package]
name = "sla_3d"
version.workspace = true
kind = "lib"
build = "zig build"
test = "bash tests/run_tests.sh"
description = "The engine's 3D domain modules (Bevy bevy_math/bevy_time/bevy_input/bevy_transform/bevy_color counterparts), one crate with domain subdirectories (Jev ruling F1). Batch A landed (P0): math, time, input, color, transform — .sal behaviour libraries under src/<domain>/, native Zig kernels kept as support libraries under native/ (Jev ruling F2), SA layout tests under tests/<domain>/. Batch B (geometry/camera/image/material/pbr/light/scene/animation/gizmos/particle/camera_controller) lands in P1 per the survey plan."

# Import provenance: sa_plugin_3dengines @ 06f4fae, batch A imported by
# the slaengine P0 batch under the survey plan's module ruling table
# (PLAN section 4.3) and P0 phasing (PLAN section 5):
#   sa_plugin_3d_<domain>/3d_<domain>.sal -> src/<domain>/ (verbatim;
#     transform's one cross-import "../sa_plugin_3d_math/3d_math.sal"
#     rewritten to "../math/3d_math.sal")
#   sa_plugin_3d_<domain>/tests/3d_<domain>_layout_test.sa ->
#     tests/<domain>/ (only its line-1 .sal import path rewritten)
#   sa_plugin_3d_{math,time,transform}/src/plugin.zig -> native/<domain>.zig
#     with exactly the 6 plugin-framework glue lines removed (the
#     module_plugin import, the two descriptor re-exports, the comptime
#     reference block); every other line byte-identical.
# Not imported: sap.json, src/module_config.zig, per-plugin build.zig
# (plugin-era host scaffolding, retired; replaced by this crate's
# build.zig), and the input/color plugin.zig files (framework
# boilerplate only, no kernel content — their tests exercise the .sal
# alone and run without SA_PLUGINS_PATH, as in the source family).
# Test caliber mirrors the source family: zig build + zig build test
# (kernel unit tests), then per-domain `sa test` of the layout test
# with SA_PLUGINS_PATH set to that domain's support library.
