[package]
name = "sla_ecs"
version.workspace = true
kind = "lib"
entry = "src/ecs_world.sla"
test = "bash tests/run_tests.sh"
description = "The engine's ECS core (Bevy bevy_ecs counterpart): entity/storage/archetype/world backends, query, commands, schedule, system params, messages/observers, relationships, resources, plus pre-delimited task (bevy_tasks) and descriptor-reflect (bevy_reflect subset) logical groups in one flat crate. Public surface is the unified facade src/ecs_world.sla (ecs_world_*). Populated by one-shot full takeover of layola13/sla_ecs @ 1be020b (owner ruling 2026-11-01: no longer maintained standalone; this crate is the only home)."

# Import provenance: sla_ecs @ 1be020b, imported by the slaengine P0 batch
# under the survey plan's directory mapping (PLAN section 2.3):
#   lib/*.sla (521, incl. *_deep variants) -> src/ flat, same names;
#   lib/component_metadata.sai/.sal -> src/; tests/*.sla (426) -> tests/;
#   examples/*.sla (90) -> examples/; docs/ + root *.md group -> docs/.
# Byte fidelity: lib files identical except 7 files whose "lib/..."
# imports were normalised to bare names (filtered_resource_builders,
# message_iterators, message_mutator, message_reader_writer,
# message_registry_update, messages_buffer, query_filtered_set);
# tests/examples differ only on @import lines ("lib/..." / "../lib/..."
# -> "../src/..."). Line-wise diff audit at import time: no non-import
# line changed anywhere.
# Not imported: lib/world_table_erased.sa (build artifact),
# src/main.sla + workspace_demo/ (return-0 stubs), fix_while_semicolon.py.
# Test caliber (the project's own, README Running): per-file
# `SA_PLUGIN_DEV=1 sa sla test <file>` over src/ + tests/ + examples/,
# with src/parallel_iterator.sla and src/task_pool_builder.sla run
# `--test-backend sa`. tests/run_tests.sh executes that caliber and
# prints the failing-name set. No build entry is declared: this is a
# source library whose build verification IS the per-file test caliber
# (every listed file compiles under `sa sla test`).
